services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_password
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
      - ./mariadb/conf.d/logging.cnf:/etc/mysql/conf.d/logging.cnf:ro
    restart: unless-stopped

  wordpress:
    image: wordpress:fpm-alpine
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./data/wordpress:/var/www/html
      - ./data/logs/php-fpm:/var/log/php-fpm
      - ./php/zz-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.23
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./data/logs/nginx:/var/log/nginx:ro
      - ./data/logs/php-fpm:/var/log/php-fpm:ro
      - ./data/logs/mysql:/var/log/mysql:ro
      - ./data/filebeat:/usr/share/filebeat/data
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ./data/loki:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  vector:
    image: timberio/vector:0.59.0-alpine
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    restart: unless-stopped
