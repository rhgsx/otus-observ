; Страница статуса php-fpm для Telegraf (inputs.phpfpm, fcgi://wordpress:9000/status)
[www]
pm.status_path = /status
ping.path = /ping

; Логировать запросы дольше 5 секунд — счётчик slow_requests в метриках
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; Максимум воркеров в пуле. Алерт phpfpm_saturation считает загрузку от этого числа
pm.max_children = 10
