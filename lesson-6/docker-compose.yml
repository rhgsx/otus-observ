services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_password
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wordpress:
    image: wordpress:fpm-alpine
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./data/wordpress:/var/www/html
      - ./php/zz-status.conf:/usr/local/etc/php-fpm.d/zz-status.conf:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    depends_on:
      - wordpress
    restart: unless-stopped

  telegraf:
    image: telegraf:1.32
    hostname: cms-vm
    user: "telegraf:0"
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_MOUNT_PREFIX: /hostfs
      MYSQL_TELEGRAF_PASSWORD: telegraf_password
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/logs/nginx:/var/log/nginx:ro
    depends_on:
      - influxdb
      - nginx
      - db
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB: telegraf
      INFLUXDB_HTTP_LOG_ENABLED: "false"
      INFLUXDB_REPORTING_DISABLED: "true"
    volumes:
      - ./data/influxdb:/var/lib/influxdb
    ports:
      - "8086:8086"
    restart: unless-stopped

  kapacitor:
    image: kapacitor:1.7
    hostname: kapacitor
    environment:
      KAPACITOR_HOSTNAME: kapacitor
      KAPACITOR_INFLUXDB_0_URLS_0: http://influxdb:8086
      KAPACITOR_REPORTING_ENABLED: "false"
      KAPACITOR_LOAD_ENABLED: "true"
      KAPACITOR_LOAD_DIR: /etc/kapacitor/load
      KAPACITOR_TELEGRAM_ENABLED: "true"
      KAPACITOR_TELEGRAM_TOKEN: 875xxxxxxxxxbQg
      KAPACITOR_TELEGRAM_CHAT_ID: "93xxxxxx33"
    volumes:
      - ./kapacitor/load:/etc/kapacitor/load:ro
      - ./data/kapacitor:/var/lib/kapacitor
    ports:
      - "9092:9092"
    depends_on:
      - influxdb
    restart: unless-stopped

  chronograf:
    image: chronograf:1.10
    environment:
      INFLUXDB_URL: http://influxdb:8086
      KAPACITOR_URL: http://kapacitor:9092
      REPORTING_DISABLED: "true"
    volumes:
      - ./data/chronograf:/var/lib/chronograf
    ports:
      - "8888:8888"
    depends_on:
      - influxdb
      - kapacitor
    restart: unless-stopped
