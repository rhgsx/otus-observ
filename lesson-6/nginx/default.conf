# 1, если ответ 5xx, иначе 0 — удобно суммировать в Kapacitor
map $status $is_5xx {
    ~^5     1;
    default 0;
}

# Access-лог в JSON: его читает Telegraf (inputs.tail) → measurement nginx_access
log_format cms_json escape=json
    '{'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":"$status",'
        '"is_5xx":$is_5xx,'
        '"request_time":$request_time,'
        '"bytes":$body_bytes_sent'
    '}';

server {
    listen 80;
    server_name _;

    root  /var/www/html;
    index index.php;

    access_log /var/log/nginx/access.json cms_json;

    # Метрики nginx для Telegraf (inputs.nginx). Доступ только из docker-сетей.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass  wordpress:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires    7d;
        access_log off;
    }
}
