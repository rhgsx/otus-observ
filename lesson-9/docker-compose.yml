services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_password
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
      - ./mariadb/conf.d/logging.cnf:/etc/mysql/conf.d/logging.cnf:ro
    restart: unless-stopped

  wordpress:
    image: wordpress:fpm-alpine
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./data/wordpress:/var/www/html
      - ./data/logs/php-fpm:/var/log/php-fpm
      - ./php/zz-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:5.1.3
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./data/logs/nginx:/var/log/nginx:ro
      - ./data/logs/php-fpm:/var/log/php-fpm:ro
      - ./data/logs/mysql:/var/log/mysql:ro
      - ./data/fluent-bit:/fluent-bit/data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    restart: unless-stopped

  data-prepper:
    image: opensearchproject/data-prepper:2.16.0
    volumes:
      - ./data-prepper/pipeline/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    restart: unless-stopped
