[SERVICE]
    Flush     5
    Log_Level info

[INPUT]
    Name           tail
    Tag            nginx_access
    Path           /var/log/nginx/access.log
    Key            message
    DB             /fluent-bit/data/nginx_access.db
    Read_from_Head On

[INPUT]
    Name           tail
    Tag            nginx_error
    Path           /var/log/nginx/error.log
    Key            message
    DB             /fluent-bit/data/nginx_error.db
    Read_from_Head On

[INPUT]
    Name           tail
    Tag            php_access
    Path           /var/log/php-fpm/access.log
    Key            message
    DB             /fluent-bit/data/php_access.db
    Read_from_Head On

[INPUT]
    Name           tail
    Tag            php_error
    Path           /var/log/php-fpm/error.log
    Key            message
    DB             /fluent-bit/data/php_error.db
    Read_from_Head On

[INPUT]
    Name           tail
    Tag            mysql_error
    Path           /var/log/mysql/error.log
    Key            message
    DB             /fluent-bit/data/mysql_error.db
    Read_from_Head On

[FILTER]
    Name  modify
    Match nginx_access
    Add   log_type nginx_access

[FILTER]
    Name  modify
    Match nginx_error
    Add   log_type nginx_error

[FILTER]
    Name  modify
    Match php_access
    Add   log_type php_access

[FILTER]
    Name  modify
    Match php_error
    Add   log_type php_error

[FILTER]
    Name  modify
    Match mysql_error
    Add   log_type mysql_error

[OUTPUT]
    Name   http
    Match  *
    Host   data-prepper
    Port   2021
    URI    /log/ingest
    Format json
