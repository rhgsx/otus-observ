services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_password
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
      - ./mariadb/conf.d/logging.cnf:/etc/mysql/conf.d/logging.cnf:ro
    restart: unless-stopped

  wordpress:
    image: wordpress:fpm-alpine
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./data/wordpress:/var/www/html
      - ./data/logs/php-fpm:/var/log/php-fpm
      - ./php/zz-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    restart: unless-stopped

  sidecar:
    build: ./sidecar
    volumes:
      - ./sidecar/sidecar.yml:/etc/graylog/sidecar/sidecar.yml:ro
      - ./data/logs/nginx:/var/log/nginx:ro
      - ./data/logs/php-fpm:/var/log/php-fpm:ro
      - ./data/logs/mysql:/var/log/mysql:ro
      - ./data/sidecar:/var/lib/graylog-sidecar
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      action.auto_create_index: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    volumes:
      - ./data/mongodb:/data/db
    restart: unless-stopped

  graylog:
    image: graylog/graylog:6.3.15
    environment:
      GRAYLOG_PASSWORD_SECRET: "somepasswordpepper_somepasswordpepper"
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://0.0.0.0:9000/"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    volumes:
      - graylog_data:/usr/share/graylog/data
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  graylog_data:
