sources:
  docker:
    type: docker_logs
    include_labels: ["com.docker.compose.project=vm-mon"]

transforms:
  parse:
    type: remap
    inputs: [docker]
    source: |
      .service = .label."com.docker.compose.service"
      del(.label)

sinks:
  loki:
    type: loki
    inputs: [parse]
    endpoint: "http://loki:3100"
    encoding:
      codec: json
    labels:
      vm: mon
      service: "{{ service }}"
