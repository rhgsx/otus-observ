services:
  wordpress:
    image: wordpress:fpm-alpine
    environment:
      WORDPRESS_DB_HOST: haproxy:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./data/wordpress:/var/www/html
      - ./php/zz-status.conf:/usr/local/etc/php-fpm.d/zz-status.conf
    depends_on:
      - haproxy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - wordpress
    restart: unless-stopped

  consul-agent:
    image: hashicorp/consul:1.22
    command: ["agent", "-node=app"]
    volumes:
      - ./consul/agent.hcl:/consul/config/agent.hcl:ro
      - ./data/consul:/consul/data
    restart: unless-stopped

  haproxy:
    build: ./haproxy
    volumes:
      - ./haproxy/consul-template.hcl:/etc/haproxy/consul-template.hcl:ro
      - ./haproxy/haproxy.cfg.ctmpl:/etc/haproxy/haproxy.cfg.ctmpl:ro
    ports:
      - "8404:8404"
    depends_on:
      - consul-agent
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx
    restart: unless-stopped

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:latest
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://wordpress:9000/status"
    depends_on:
      - wordpress
    restart: unless-stopped

  node-exporter-app:
    image: prom/node-exporter:latest
    pid: host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  vector-app:
    image: timberio/vector:0.59.0-alpine
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  default:
    name: infra
    external: true
