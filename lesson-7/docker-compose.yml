services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_password
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./data/logs/mysql:/var/log/mysql
      - ./mariadb/conf.d/logging.cnf:/etc/mysql/conf.d/logging.cnf:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  wordpress:
    image: wordpress:fpm-alpine
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./data/wordpress:/var/www/html
      - ./data/logs/php-fpm:/var/log/php-fpm
      - ./php/zz-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/logs/nginx:/var/log/nginx
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.23
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./data/logs/nginx:/var/log/nginx:ro
      - ./data/logs/php-fpm:/var/log/php-fpm:ro
      - ./data/logs/mysql:/var/log/mysql:ro
      - ./data/filebeat:/usr/share/filebeat/data
    restart: unless-stopped

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.19.23
    user: root
    command: ["-e", "--strict.perms=false", "--system.hostfs=/hostfs"]
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
    restart: unless-stopped


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_OPTIN: "false"
    ports:
      - "5601:5601"
    restart: unless-stopped

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:8.19.23
    hostname: elk-vm
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    restart: unless-stopped
