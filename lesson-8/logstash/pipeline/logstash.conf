input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][log_type] == "nginx_access" {
    grok {
      match => { "message" => '%{IPORHOST:client_ip} - %{NOTSPACE:user} \[%{HTTPDATE:time}\] "%{WORD:method} %{DATA:url} HTTP/%{NUMBER:http_version}" %{NUMBER:status:int} %{NUMBER:bytes:int} "%{DATA:referrer}" "%{DATA:agent}"' }
    }
  } else if [fields][log_type] == "nginx_error" {
    grok {
      match => { "message" => '%{DATA:time} \[%{LOGLEVEL:level}\] %{NUMBER:pid}#%{NUMBER}: %{GREEDYDATA:error}' }
    }
  } else if [fields][log_type] == "php_access" {
    grok {
      match => { "message" => '%{IPORHOST:client_ip} -\s+%{HTTPDATE:time} "%{WORD:method} %{DATA:url}" %{NUMBER:status:int}' }
    }
  } else if [fields][log_type] == "php_error" {
    grok {
      match => { "message" => '\[%{DATA:time}\] %{LOGLEVEL:level}: %{GREEDYDATA:error}' }
    }
  } else if [fields][log_type] == "mysql_error" {
    grok {
      match => { "message" => '%{TIMESTAMP_ISO8601:time} %{NUMBER:thread} \[%{WORD:level}\] %{GREEDYDATA:error}' }
    }
  }

  date {
    match => ["time", "dd/MMM/yyyy:HH:mm:ss Z", "yyyy/MM/dd HH:mm:ss", "dd-MMM-yyyy HH:mm:ss", "yyyy-MM-dd HH:mm:ss"]
    remove_field => ["time"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cms-logstash-%{+YYYY.MM.dd}"
  }
}
